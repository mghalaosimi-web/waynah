<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#080e12; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="future-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a0d"/>
      <stop offset="100%" stop-color="#0c1820"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#future-grad)"/>

  <!-- Header -->
  <rect x="60" y="45" width="220" height="32" rx="16" fill="#7C3AED" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="170" y="66" text-anchor="middle" fill="#A78BFA" font-size="13" font-weight="700" letter-spacing="1">FUTURE VISION SPECIFICATION</text>

  <text x="60" y="115" fill="#FFFFFF" font-size="32" font-weight="800">WAYNAH Future Architecture &amp; System Expansion Roadmap</text>
  <text x="60" y="145" fill="#94A3B8" font-size="15" font-weight="400">Strictly categorized exploratory directions, offline PWA caching, native mobile apps &amp; AI vector search</text>

  <!-- 3 Major Architectural Layers -->
  <!-- Layer 1: Offline PWA & Tile Cache -->
  <rect x="60" y="185" width="340" height="440" rx="16" fill="#0d161d" stroke="#1f2f3d" stroke-width="1.5"/>
  <rect x="80" y="205" width="300" height="36" rx="8" fill="#0F766E" fill-opacity="0.25" stroke="#14B8A6" stroke-width="1"/>
  <text x="230" y="228" text-anchor="middle" fill="#2DD4BF" font-size="14" font-weight="700">01 — OFFLINE PWA TILE CACHE</text>

  <text x="80" y="275" fill="#FFFFFF" font-size="16" font-weight="700">Low-Bandwidth Yemen Sync</text>
  <text x="80" y="300" fill="#94A3B8" font-size="13">• Vector Tile Cache (`packages/maps/src/offline-tiles`)</text>
  <text x="80" y="325" fill="#94A3B8" font-size="13">• Service Worker Network Strategy</text>
  <text x="80" y="350" fill="#94A3B8" font-size="13">• Local IndexedDB Spatial Boundary Cache</text>
  <text x="80" y="375" fill="#94A3B8" font-size="13">• Background Delta Synchronization</text>

  <rect x="80" y="420" width="300" height="130" rx="12" fill="#132029" stroke="#14B8A6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="95" y="445" fill="#2DD4BF" font-size="13" font-weight="700">Architectural Status:</text>
  <text x="95" y="470" fill="#E2E8F0" font-size="12">• PWA Manifest &amp; Offline Cache Layer</text>
  <text x="95" y="490" fill="#E2E8F0" font-size="12">• Validated &amp; Ready for Provisioning</text>
  <text x="95" y="510" fill="#E2E8F0" font-size="12">• Deferred from initial public launch</text>

  <rect x="80" y="570" width="300" height="36" rx="8" fill="#16252f" stroke="#0F766E" stroke-width="1"/>
  <text x="230" y="593" text-anchor="middle" fill="#2DD4BF" font-size="12" font-weight="700">PROVISIONING READY</text>

  <!-- Layer 2: Mobile & Background Worker Queues -->
  <rect x="430" y="185" width="340" height="440" rx="16" fill="#0d161d" stroke="#1f2f3d" stroke-width="1.5"/>
  <rect x="450" y="205" width="300" height="36" rx="8" fill="#3B82F6" fill-opacity="0.2" stroke="#60A5FA" stroke-width="1"/>
  <text x="600" y="228" text-anchor="middle" fill="#60A5FA" font-size="14" font-weight="700">02 — MOBILE &amp; REDIS WORKERS</text>

  <text x="450" y="275" fill="#FFFFFF" font-size="16" font-weight="700">Expo Native &amp; Async Tasks</text>
  <text x="450" y="300" fill="#94A3B8" font-size="13">• React Native / Expo Mobile Apps (`apps/mobile`)</text>
  <text x="450" y="325" fill="#94A3B8" font-size="13">• BullMQ + Redis Background Queues (`apps/workers`)</text>
  <text x="450" y="350" fill="#94A3B8" font-size="13">• Async Geocoding &amp; Boundary Resolution</text>
  <text x="450" y="375" fill="#94A3B8" font-size="13">• WhatsApp &amp; SMS Verification Dispatcher</text>

  <rect x="450" y="420" width="300" height="130" rx="12" fill="#132029" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="465" y="445" fill="#60A5FA" font-size="13" font-weight="700">Architectural Status:</text>
  <text x="465" y="470" fill="#E2E8F0" font-size="12">• `docker-compose.prod.yml` Redis Topology</text>
  <text x="465" y="490" fill="#E2E8F0" font-size="12">• Native Mobile Workspace Blueprint</text>
  <text x="465" y="510" fill="#E2E8F0" font-size="12">• Fully Validated Deferred Pipeline</text>

  <rect x="450" y="570" width="300" height="36" rx="8" fill="#16252f" stroke="#3B82F6" stroke-width="1"/>
  <text x="600" y="593" text-anchor="middle" fill="#60A5FA" font-size="12" font-weight="700">VALIDATED BLUEPRINT</text>

  <!-- Layer 3: pgvector AI Location Assistant -->
  <rect x="800" y="185" width="340" height="440" rx="16" fill="#0d161d" stroke="#1f2f3d" stroke-width="1.5"/>
  <rect x="820" y="205" width="300" height="36" rx="8" fill="#8B5CF6" fill-opacity="0.2" stroke="#A78BFA" stroke-width="1"/>
  <text x="970" y="228" text-anchor="middle" fill="#A78BFA" font-size="14" font-weight="700">03 — PGVECTOR AI ASSISTANT</text>

  <text x="820" y="275" fill="#FFFFFF" font-size="16" font-weight="700">Semantic Dialectal Search</text>
  <text x="820" y="300" fill="#94A3B8" font-size="13">• pgvector Vector Similarity Indexing</text>
  <text x="820" y="325" fill="#94A3B8" font-size="13">• Dialectal Yemeni Arabic Natural Language Intent</text>
  <text x="820" y="350" fill="#94A3B8" font-size="13">• RAG (Retrieval-Augmented Generation) Context</text>
  <text x="820" y="375" fill="#94A3B8" font-size="13">• Unified Merchant Subscription Engine</text>

  <rect x="820" y="420" width="300" height="130" rx="12" fill="#132029" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="835" y="445" fill="#A78BFA" font-size="13" font-weight="700">Architectural Status:</text>
  <text x="835" y="470" fill="#E2E8F0" font-size="12">• Natural Language AI Location Hypothesis</text>
  <text x="835" y="490" fill="#E2E8F0" font-size="12">• Exploratory Direction (Phase 13+)</text>
  <text x="835" y="510" fill="#E2E8F0" font-size="12">• Non-blocking future enhancement</text>

  <rect x="820" y="570" width="300" height="36" rx="8" fill="#16252f" stroke="#8B5CF6" stroke-width="1"/>
  <text x="970" y="593" text-anchor="middle" fill="#A78BFA" font-size="12" font-weight="700">EXPLORATORY HYPOTHESIS</text>
</svg>
