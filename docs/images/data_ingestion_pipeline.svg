<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0b1419; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bg-grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071014"/>
      <stop offset="100%" stop-color="#0f1d24"/>
    </linearGradient>
    <linearGradient id="teal-grad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad4)"/>

  <!-- Header -->
  <rect x="60" y="45" width="220" height="32" rx="16" fill="#0F766E" fill-opacity="0.2" stroke="#0F766E" stroke-width="1.5"/>
  <text x="170" y="66" text-anchor="middle" fill="#14B8A6" font-size="13" font-weight="700" letter-spacing="1">DATA PIPELINE ARCHITECTURE</text>

  <text x="60" y="115" fill="#FFFFFF" font-size="32" font-weight="800">WAYNAH Geographic Data Ingestion &amp; Boundary Import</text>
  <text x="60" y="145" fill="#94A3B8" font-size="15" font-weight="400">Automated administrative boundary import scripts and PostGIS polygon containment resolution</text>

  <!-- 4 Data Processing Stages -->
  <!-- Stage 1 -->
  <rect x="60" y="200" width="240" height="420" rx="16" fill="#101a21" stroke="#1f2d38" stroke-width="1.5"/>
  <rect x="80" y="220" width="200" height="32" rx="8" fill="#1E293B"/>
  <text x="180" y="241" text-anchor="middle" fill="#38BDF8" font-size="13" font-weight="700">STAGE 01 — RAW INGESTION</text>

  <text x="80" y="285" fill="#FFFFFF" font-size="16" font-weight="700">OCHA &amp; Field Sources</text>
  <text x="80" y="315" fill="#94A3B8" font-size="13">• GeoJSON MultiPolygon Specs</text>
  <text x="80" y="340" fill="#94A3B8" font-size="13">• PCode External Identifiers</text>
  <text x="80" y="365" fill="#94A3B8" font-size="13">• Field Landmark Coordinates</text>
  <text x="80" y="390" fill="#94A3B8" font-size="13">• PlaceObservation Payload</text>

  <rect x="80" y="550" width="200" height="40" rx="8" fill="#16252f" stroke="#38BDF8" stroke-width="1"/>
  <text x="180" y="575" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="700">Multi-Source Input</text>

  <!-- Arrow 1 -->
  <path d="M 310 410 L 340 410" stroke="#0F766E" stroke-width="3" fill="none"/>
  <polygon points="340,405 350,410 340,415" fill="#0F766E"/>

  <!-- Stage 2 -->
  <rect x="360" y="200" width="240" height="420" rx="16" fill="#101a21" stroke="#1f2d38" stroke-width="1.5"/>
  <rect x="380" y="220" width="200" height="32" rx="8" fill="#1E293B"/>
  <text x="480" y="241" text-anchor="middle" fill="#34D399" font-size="13" font-weight="700">STAGE 02 — CLEAN &amp; ETL</text>

  <text x="380" y="285" fill="#FFFFFF" font-size="16" font-weight="700">TypeScript Data Pipelines</text>
  <text x="380" y="315" fill="#94A3B8" font-size="13">• `import-yemen-boundaries.ts`</text>
  <text x="380" y="340" fill="#94A3B8" font-size="13">• `import-yemen-geography.ts`</text>
  <text x="380" y="365" fill="#94A3B8" font-size="13">• WKT / GeoJSON Conversion</text>
  <text x="380" y="390" fill="#94A3B8" font-size="13">• Duplicate Candidate Scoring</text>

  <rect x="380" y="550" width="200" height="40" rx="8" fill="#16252f" stroke="#34D399" stroke-width="1"/>
  <text x="480" y="575" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">Automated Import</text>

  <!-- Arrow 2 -->
  <path d="M 610 410 L 640 410" stroke="#0F766E" stroke-width="3" fill="none"/>
  <polygon points="640,405 650,410 640,415" fill="#0F766E"/>

  <!-- Stage 3 -->
  <rect x="660" y="200" width="240" height="420" rx="16" fill="#101a21" stroke="#1f2d38" stroke-width="1.5"/>
  <rect x="680" y="220" width="200" height="32" rx="8" fill="#1E293B"/>
  <text x="780" y="241" text-anchor="middle" fill="#FBBF24" font-size="13" font-weight="700">STAGE 03 — POSTGIS GEO</text>

  <text x="680" y="285" fill="#FFFFFF" font-size="16" font-weight="700">Spatial Polygon Check</text>
  <text x="680" y="315" fill="#94A3B8" font-size="13">• `ST_Covers(d.boundary, point)`</text>
  <text x="680" y="340" fill="#94A3B8" font-size="13">• `ST_DWithin` Fallback Radius</text>
  <text x="680" y="365" fill="#94A3B8" font-size="13">• `GEOGRAPHIC_CONTEXT_MISMATCH`</text>
  <text x="680" y="390" fill="#94A3B8" font-size="13">• District Boundary Integrity</text>

  <rect x="680" y="550" width="200" height="40" rx="8" fill="#16252f" stroke="#FBBF24" stroke-width="1"/>
  <text x="780" y="575" text-anchor="middle" fill="#FBBF24" font-size="12" font-weight="700">Spatial Validation</text>

  <!-- Arrow 3 -->
  <path d="M 910 410 L 940 410" stroke="#0F766E" stroke-width="3" fill="none"/>
  <polygon points="940,405 950,410 940,415" fill="#0F766E"/>

  <!-- Stage 4 -->
  <rect x="960" y="200" width="180" height="420" rx="16" fill="#101a21" stroke="#0F766E" stroke-width="2"/>
  <rect x="975" y="220" width="150" height="32" rx="8" fill="#0F766E"/>
  <text x="1050" y="241" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">STAGE 04 — DATABASE</text>

  <text x="975" y="285" fill="#FFFFFF" font-size="15" font-weight="700">Indexed Storage</text>
  <text x="975" y="315" fill="#94A3B8" font-size="12">• PostgreSQL 17</text>
  <text x="975" y="340" fill="#94A3B8" font-size="12">• PostGIS 3.3.7</text>
  <text x="975" y="365" fill="#94A3B8" font-size="12">• GiST Spatial Indexes</text>
  <text x="975" y="390" fill="#94A3B8" font-size="12">• AuditLog Persistence</text>

  <rect x="975" y="550" width="150" height="40" rx="8" fill="url(#teal-grad4)"/>
  <text x="1050" y="575" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">Spatial Database</text>
</svg>
