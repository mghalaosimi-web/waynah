version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: waynah_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: waynah_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d waynah_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
