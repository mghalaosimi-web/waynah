name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: waynah-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/waynah_ci?schema=public
      INGESTION_API_KEY: ci-only-not-a-production-secret
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript workspace check
        run: pnpm typecheck

      - name: API test suite
        run: pnpm --filter @waynah/api test --reporter=dot

      - name: Search package test suite
        run: pnpm --filter @waynah/search test --reporter=dot

      - name: Workspace production build
        run: pnpm build
